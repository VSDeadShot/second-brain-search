# Retrieval eval suite, version 2 - the owner's questions from 2026-09-21, revised 2026-09-25.
#
# `expected_projects` are the owner's own guesses, mapped to the project names the
# index actually uses (watch-next -> Watch Tracker, omnitask -> ToDoApp,
# bixby-pc-navigator -> bixby-workspace, second-brain-search -> Second Brain).
# `also_in_corpus` records further projects a manual grep found answering the
# question; they are reported but never scored.
#
# Each question is scored by one check, chosen by the fields it carries:
# - `expected_text`: a passage in the top k must contain one of these strings
#   (case-insensitive, whitespace collapsed, otherwise exact). For facts.
# - `expected_projects` alone: every listed project must appear in the top k. For
#   "which of my projects..." questions, where the projects are the answer.
# - `expected_projects = []`: nothing in the corpus answers it. Scores are kept,
#   nothing is passed or failed; whether `sbs ask` refuses it is checked by asking.
#
# v2 changes: Q1 split into a fact (Q1a) and a rationale (Q1b), because v1's Q1
# passed on the project check while `sbs ask` refused it - no passage named the
# model. Q2, Q4 and Q9 gained the string that states their fact. Q5 became a
# no-answer question: its answer exists only in git history.
#
# Rules for expected_text strings:
# - VERBATIM ONLY. Every string must be a phrasing that exists in the corpus as
#   written, never a paraphrase. Only whitespace may differ, since the matcher
#   collapses line wraps. When a fact is stated in more than one place with
#   different words, list each wording; one match is enough.
# - RARE. Count a string against the live index before adding it. It must appear
#   only in passages that state the answer, or it passes without finding anything.
# Every string below was counted on 2026-09-25 with the matcher's own
# normalisation.
#
# Scoring is mechanical. Whether an answer is any good stays a human judgement.

version = 2

[[question]]
id = "q1a-flashcards-model-default"
category = "exact-fact"
text = "Which Gemini model does Interview Flashcards use by default?"
expected_projects = ["Interview Flashcards"]
expected_text = ["gemini-3.7-flash"]
notes = """
What the corpus says, not what is true: the owner runs 3.6-flash, since 3.7 kept failing
under load after the doc was written. The string is in exactly 3 indexed chunks, all in
docs/superpowers/plans/2026-08-18-ai-card-generation.md (#5, #21, #23) - one code line in
each 33-44-line chunk. For v1's wording ("...and why?") the best of them ranked 20th of 812
uncapped on 2026-09-25, and it could not appear at any k on the capped path.
"""

[[question]]
id = "q1b-flashcards-model-why"
category = "trap"
text = "Why did I choose the default Gemini model for Interview Flashcards?"
expected_projects = []
notes = """
No doc says why the model was chosen - only why it is configurable
(specs/2026-08-18-ai-card-generation-design.md:134). A trap because the passages about
configurability read like an answer.
"""

[[question]]
id = "q2-generation-limit"
category = "exact-fact"
text = "What limit did I put on the Gemini-calling endpoint, and what does the client get when it's hit?"
expected_projects = ["Interview Flashcards"]
expected_text = ["20 calls per owner per day", "20 generations per owner per day"]
notes = """
CLAUDE.md:129 (20 calls per owner per day); docs/api-contract.md:562-572 (20 generations per
owner per day, wrapped across two lines; 429 + Retry-After). The two wordings are one fact
stated twice, each in exactly one chunk (CLAUDE.md #23, api-contract.md #34). v2's first run
listed only CLAUDE.md's wording and failed Q2 although #34 had been retrieved. The check covers
the limit only - one of several strings is enough, so it can't also require the 429 half.
"""

[[question]]
id = "q3-watch-next-auth"
category = "exact-fact"
text = "How do the Watch Next frontend and backend authenticate to each other?"
expected_projects = ["Watch Tracker"]
notes = """
EXPLAINER.md:1782-1799 - X-API-Key held by a proxy, never given to the browser.
Stays on the project check: no string is rare enough to trust. API_SECRET is in 7 chunks,
and one X-API-Key hit is a passage saying there was no such key.
"""

[[question]]
id = "q4-omnitask-lost-writes"
category = "how-did-i"
text = "How did I fix the lost writes in OmniTask?"
expected_projects = ["ToDoApp"]
expected_text = ["swaps the file in atomically"]
notes = """
README.md:199-202 - a lock around the read-modify-write plus an atomic file swap.
Not "read-modify-write", which also appears in budget-app's CLAUDE.md.
"""

[[question]]
id = "q5-dsa-review-security"
category = "how-did-i"
text = "What security bug did I find in the DSA Tracker's review endpoint, and how did I fix it?"
expected_projects = []
notes = """
NOT answerable from the indexed corpus. DSA Tracker's only markdown is CLAUDE.md and README.md,
neither of which mentions it. The fix exists only in git history: commit b237453
"security: Fix submitReview authorization vulnerability by verifying problem ownership".
v1 scored this on the project check, where DSA Tracker coming back was a pass that could not
fail. Now a no-answer question, kept to watch for false confidence.
"""

