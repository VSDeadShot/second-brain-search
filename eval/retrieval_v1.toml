# Retrieval eval suite, version 1 - the owner's 10 questions from 2026-09-21.
#
# `expected_projects` are the owner's own guesses, mapped to the project names the
# index actually uses (watch-next -> Watch Tracker, omnitask -> ToDoApp,
# bixby-pc-navigator -> bixby-workspace, second-brain-search -> Second Brain).
# `also_in_corpus` records further projects a manual grep found answering the
# question; they are reported but never scored.
#
# Scoring is mechanical: did the expected projects appear in the top k? Whether an
# answer is any good stays a human judgement.

version = 1

[[question]]
id = "q1-flashcards-model"
category = "exact-fact"
text = "Which Gemini model does Interview Flashcards use by default, and why?"
expected_projects = ["Interview Flashcards"]
notes = """
Partly answerable. The default is named in docs/superpowers/plans/2026-08-18-ai-card-generation.md:571
and :634, but no doc says why that model was chosen - only why it is configurable
(specs/2026-08-18-ai-card-generation-design.md:134). The doc is also stale: the owner reports
Interview Flashcards runs 3.6-flash, since 3.7 kept failing under load after that doc was written.
"""

[[question]]
id = "q2-generation-limit"
category = "exact-fact"
text = "What limit did I put on the Gemini-calling endpoint, and what does the client get when it's hit?"
expected_projects = ["Interview Flashcards"]
notes = "CLAUDE.md:129 (20 calls per owner per day); docs/api-contract.md:562-572 (429 + Retry-After)."

[[question]]
id = "q3-watch-next-auth"
category = "exact-fact"
text = "How do the Watch Next frontend and backend authenticate to each other?"
expected_projects = ["Watch Tracker"]
notes = "EXPLAINER.md:1782-1799 - X-API-Key held by a proxy, never given to the browser."

[[question]]
id = "q4-omnitask-lost-writes"
category = "how-did-i"
text = "How did I fix the lost writes in OmniTask?"
expected_projects = ["ToDoApp"]
notes = "README.md:199-202 - a lock around the read-modify-write plus an atomic file swap."

[[question]]
id = "q5-dsa-review-security"
category = "how-did-i"
text = "What security bug did I find in the DSA Tracker's review endpoint, and how did I fix it?"
expected_projects = ["DSA Tracker"]
notes = """
NOT answerable from the indexed corpus. DSA Tracker's only markdown is CLAUDE.md and README.md,
neither of which mentions it. The fix exists only in git history: commit b237453
"security: Fix submitReview authorization vulnerability by verifying problem ownership".
Retrieval cannot win this one; it is kept to watch for false confidence.
"""

[[question]]
id = "q6-rate-limiting"
category = "cross-project"
text = "Where have I used rate limiting?"
expected_projects = ["Interview Flashcards", "Watch Tracker"]
also_in_corpus = ["Shweta's Website"]
notes = "Watch Tracker rate-limits its own outgoing requests (EXPLAINER.md:505)."

[[question]]
id = "q7-gemini-projects"
category = "cross-project"
text = "Which of my projects call the Gemini API?"
expected_projects = ["macro-tracker", "Interview Flashcards", "Second Brain", "bixby-workspace"]
also_in_corpus = ["Commit Message Generator"]
notes = "Commit Message Generator has src/gemini.js (CLAUDE.md:15, :29)."

[[question]]
id = "q8-spaced-repetition"
category = "cross-project"
text = "Where have I used spaced repetition?"
expected_projects = ["DSA Tracker", "Interview Flashcards"]
notes = "DSA Tracker lib/sm2.ts (CLAUDE.md:34); Interview Flashcards CLAUDE.md:7."

[[question]]
id = "q9-signin-hammering"
category = "trap"
text = "How do I stop someone hammering my sign-in endpoint?"
expected_projects = ["Interview Flashcards"]
also_in_corpus = ["Shweta's Website"]
notes = """
Phrased with no keywords shared with the docs on purpose. The answer is LoginRateLimit
(CLAUDE.md:126-128) and docs/api-contract.md:211-212 (429 + Retry-After, rolling 15 minutes).
"""

[[question]]
id = "q10-kubernetes"
category = "trap"
text = "How did I set up Kubernetes deployment?"
expected_projects = []
notes = """
Nothing in the corpus answers this - no file matches kubernetes, k8s, kubectl, helm or pod.
Scored as expecting no answer; the report keeps the scores so weak matches stay visible
(they were 0.64/0.64/0.63 on 2026-09-21, against 0.68-0.77 for real hits).
"""
