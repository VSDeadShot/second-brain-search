# Non-secret discovery settings. Committed on purpose - secrets live in .env.
# A gitignored config.local.toml overrides anything here.

[discovery]
# Exact names and globs (case-insensitive) of documentation worth indexing.
include_patterns = [
    "README.md",
    "CLAUDE_SUMMARY.md",
    "PROJECT_STATUS.md",
    "CLAUDE.md",
    "AGENTS*.md",
    "DECISIONS.md",
    "ROADMAP.md",
    "HANDOVER.md",
    "EXPLAINER.md",
    "*BRIEF.md",
    "*SPEC.md",
    "AI_*.md",
]

# Every *.md anywhere beneath a directory with one of these names is included.
# Catches docs/superpowers/specs/*.md, which a literal docs/specs/*.md glob misses.
include_dirs = ["docs"]

# Directory names pruned at any depth. Dot-directories (.git, .venv,
# .pytest_cache, ...) are always pruned as a class and need no entry here.
exclude_dirs = [
    "node_modules",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "target",
]

# Paths relative to scan_root, pruned wholesale. Each entry is a directory or a
# single file.
#   driftless-int  - near-identical untracked copy of driftless; indexing both
#                    produces duplicate chunks and ambiguous citations.
#   CLAUDE_SUMMARY - this tool's own session changelog, not project content, and
#                    it grows every session.
exclude_paths = [
    "SIH/driftless-int",
    "Second Brain/CLAUDE_SUMMARY.md",
]

[git]
# Index each repo's commit history alongside its docs. A repo with a remote is
# read at the remote's default branch as last fetched (origin/HEAD); a repo with
# no remote is read at its local HEAD. Indexing never fetches.
enabled = true

# Only commits by these authors are indexed - a commit matching EITHER list is
# kept. Leave both empty HERE: the real values go in the gitignored
# config.local.toml, which overrides these keys. With enabled = true and both
# lists empty, `sbs index` refuses to run.
author_emails = []
author_names = []

# A commit with no body, or a message under thin_message_chars, also gets this
# much of its diff (secret-looking lines, lockfiles, images and env files removed).
diff_excerpt_chars = 800
thin_message_chars = 200

[mcp]
# What the MCP server (`sbs-mcp`) hides from Claude. Set exclude_projects ONLY in
# the gitignored config.local.toml - the names themselves are private. It is left
# unset here on purpose: unset, the server refuses every call, so a missing local
# file can't expose anything. `exclude_projects = []` there hides nothing.
